<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410"><rect width="900" height="410" fill="#edf3ee"/><g font-family="Arial" fill="#173b36"><text x="40" y="50" font-size="25" font-weight="bold">Uma resposta coordenada</text><text x="40" y="80" font-size="17">Esquema educativo da resposta erétil</text><rect x="35" y="108" width="830" height="78" rx="10" fill="white"/><text x="55" y="155" font-size="29" fill="#8b632c">01</text><text x="115" y="138" font-size="23" font-weight="bold">Estímulos e sinais nervosos</text><text x="115" y="166" font-size="19">Participam do relaxamento da musculatura lisa.</text><rect x="35" y="202" width="830" height="78" rx="10" fill="white"/><text x="55" y="249" font-size="29" fill="#8b632c">02</text><text x="115" y="232" font-size="23" font-weight="bold">Entrada de sangue aumenta</text><text x="115" y="260" font-size="19">Os tecidos eréteis recebem mais sangue.</text><rect x="35" y="296" width="830" height="78" rx="10" fill="white"/><text x="55" y="343" font-size="29" fill="#8b632c">03</text><text x="115" y="326" font-size="23" font-weight="bold">Saída de sangue diminui</text><text x="115" y="354" font-size="19">A compressão das veias ajuda a manter a rigidez.</text></g></svg>